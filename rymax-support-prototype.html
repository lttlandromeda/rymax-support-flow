<title>Rymax Support Walkthrough</title>
<meta name="description" content="A 3-slide interactive walkthrough of the Rymax AI customer-support flow — request form, AI case summary, and specialist dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,420;9..144,520;9..144,600&family=Open+Sans:wght@400;500;600;700&display=swap">

<style>
  :root{
    --stage-bg:#242121;
    --deck-bg:#403c3b;
    --deck-title:#faf4ed;
    --deck-body:#e4dfd8;
    --deck-muted:rgba(228,223,216,.62);
    --deck-faint:rgba(228,223,216,.34);
    --deck-line:rgba(250,244,237,.14);

    --app-bg:#faf4ed;
    --app-surface:#ffffff;
    --app-border:#eae1d7;
    --input-bg:#f7ecdc;
    --input-border:#e8dabf;
    --tan-highlight:#f1e3ce;

    --ink:#2b2621;
    --ink-soft:#4c443c;
    --text-secondary:#6c6259;
    --text-tertiary:#978c7d;
    --line:#e8ddcc;

    --accent:#b25f30;
    --accent-soft:#b25f301c;
    --success:#3e6a49;
    --success-soft:#3e6a4914;

    --radius-card:14px;
    --radius-input:10px;
    --radius-pill:999px;
    --shadow-card:0 1px 2px rgba(43,38,34,.06);
    --shadow-raised:0 24px 60px rgba(0,0,0,.4);

    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--stage-bg)}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  button{font-family:inherit;-webkit-tap-highlight-color:transparent}
  h1,h2,p,dl,dd,dt,ol,ul{margin:0}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }

  /* ---------- stage / deck shell ---------- */
  .stage{
    min-height:100vh;
    background:var(--stage-bg);
    display:flex;
    flex-direction:column;
  }
  .deck-shell{
    flex:1;
    display:flex;
    flex-direction:column;
    background:var(--deck-bg);
  }
  .deck-left{
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:52px 24px 28px;
  }
  .deck-left-inner{
    max-width:560px;
    width:100%;
    opacity:0;
    transform:translateY(10px);
    animation:panel-in .5s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes panel-in{to{opacity:1;transform:translateY(0)}}

  .deck-eyebrow{
    margin:0 0 20px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:1.7px;
    text-transform:uppercase;
    color:var(--deck-faint);
  }
  .deck-title{
    font-family:var(--font-display);
    font-weight:520;
    font-size:clamp(32px,5vw,50px);
    line-height:1.08;
    color:var(--deck-title);
    text-wrap:balance;
  }
  .deck-subtitle{
    margin:18px 0 0;
    font-size:16.5px;
    line-height:1.55;
    color:var(--deck-body);
    max-width:46ch;
  }
  .deck-note{
    margin:18px 0 0;
    font-size:12.5px;
    line-height:1.6;
    color:var(--deck-muted);
    max-width:46ch;
  }
  .deck-note b{color:var(--deck-title);font-weight:600}
  .live-tag{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--accent);
    font-weight:700;
    letter-spacing:.3px;
    margin-right:4px;
  }
  .live-tag::before{
    content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }

  .deck-buttons{display:flex;gap:10px;margin-top:30px}
  .deck-btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:12px 20px;
    border:1px solid var(--deck-line);
    border-radius:var(--radius-pill);
    background:transparent;
    color:var(--deck-body);
    font-size:12.5px;font-weight:600;letter-spacing:.2px;
    cursor:pointer;
    transition:background .16s ease,border-color .16s ease,color .16s ease, transform .16s ease;
  }
  .deck-btn:hover{border-color:rgba(250,244,237,.4);color:var(--deck-title)}
  .deck-btn:active{transform:scale(.97)}
  .deck-btn--next{background:var(--deck-title);color:#2c2825;border-color:var(--deck-title)}
  .deck-btn--next:hover{background:#fff;color:#2c2825}
  .deck-btn svg{display:block}

  .deck-hint{margin:12px 0 0;font-size:11px;color:var(--deck-faint);letter-spacing:.3px}
  .deck-hint .kbd{display:none}

  .deck-dots{display:flex;gap:7px;margin-top:26px}
  .deck-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--deck-line);
    border:none;padding:0;cursor:pointer;
    transition:background .2s ease, width .2s ease;
  }
  .deck-dot.is-active{background:var(--deck-title);width:18px;border-radius:4px}

  .deck-caption{margin:40px 0 0;font-size:10.5px;letter-spacing:.6px;color:rgba(228,223,216,.2)}

  /* ---------- right side / browser mock ---------- */
  .deck-right{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 20px 44px;
  }
  .browser-frame{
    width:min(720px,100%);
    background:linear-gradient(160deg,#4c4645,#312d2c 45%,#1d1a19);
    border-radius:20px;
    padding:10px;
    box-shadow:var(--shadow-raised), inset 0 1px rgba(255,255,255,.08);
    opacity:0;
    transform:translateY(14px);
    animation:panel-in .55s cubic-bezier(.22,1,.36,1) .08s forwards;
  }
  .browser-chrome{
    display:flex;align-items:center;gap:14px;
    padding:10px 14px;
  }
  .traffic{display:flex;gap:7px;flex-shrink:0}
  .traffic span{width:11px;height:11px;border-radius:50%;display:block}
  .traffic span:nth-child(1){background:#ec6a5e}
  .traffic span:nth-child(2){background:#f4bf4f}
  .traffic span:nth-child(3){background:#61c454}
  .browser-nav{display:flex;gap:6px;color:rgba(255,255,255,.32);flex-shrink:0}
  .browser-url{
    flex:1;
    display:flex;align-items:center;justify-content:center;gap:6px;
    background:rgba(255,255,255,.08);
    border-radius:7px;
    padding:6px 10px;
    color:rgba(255,255,255,.72);
    font-size:12px;
    min-width:0;
  }
  .browser-url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .browser-viewport{
    background:var(--app-bg);
    border-radius:12px;
    overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .app-topbar{
    display:flex;align-items:center;
    padding:16px 28px;
    border-bottom:1px solid var(--line);
  }
  .app-topbar__title{font-size:15px;font-weight:700;color:var(--ink)}

  #appMount{
    height:min(560px,62vh);
    overflow-y:auto;
    overflow-x:hidden;
    padding:30px 28px 40px;
    scrollbar-width:thin;
  }
  #appMount::-webkit-scrollbar{width:8px}
  #appMount::-webkit-scrollbar-thumb{background:var(--app-border);border-radius:8px}

  /* ---------- shared app UI atoms ---------- */
  .app-h2{
    font-family:var(--font-display);
    font-weight:500;
    font-size:26px;
    line-height:1.2;
    color:var(--ink);
    text-align:center;
    text-wrap:balance;
  }
  .app-sub{
    margin:10px auto 0;
    font-size:13.5px;
    color:var(--text-secondary);
    text-align:center;
    max-width:38ch;
  }
  .eyebrow-mini{
    text-align:center;
    font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--text-tertiary);
    margin-bottom:8px;
  }
  .card{
    background:var(--app-surface);
    border:1px solid var(--app-border);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-card);
    padding:26px;
  }
  .card + .card{margin-top:16px}
  .card-label{
    font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
    color:var(--text-tertiary);
    margin-bottom:14px;
  }
  .pill-badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:6px 12px;
    border:1px solid var(--app-border);
    border-radius:var(--radius-pill);
    font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
    color:var(--text-secondary);
    background:var(--app-surface);
  }
  .pill-badge--accent{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
  .pill-badge b{font-variant-numeric:tabular-nums}

  .btn-primary{
    width:100%;
    padding:15px 20px;
    background:var(--ink);
    color:var(--app-bg);
    border:none;border-radius:var(--radius-input);
    font-size:14px;font-weight:600;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease, transform .1s ease;
  }
  .btn-primary:hover:not(:disabled){background:#171310}
  .btn-primary:active:not(:disabled){transform:scale(.99)}
  .btn-primary:disabled{opacity:.35;cursor:not-allowed}

  .btn-outline{
    padding:12px 18px;
    background:transparent;
    border:1px solid var(--app-border);
    border-radius:var(--radius-input);
    color:var(--ink);
    font-size:13.5px;font-weight:600;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .btn-outline:hover{background:#2e2e2e0c}

  .btn-ghost{
    padding:12px 18px;
    background:transparent;border:1px solid transparent;
    border-radius:var(--radius-input);
    color:var(--text-secondary);
    font-size:13.5px;font-weight:600;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .btn-ghost:hover{background:#2e2e2e0c;color:var(--ink)}

  /* ---------- slide 1 : request form ---------- */
  .stepper{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px}
  .step-pill{
    padding:8px 14px;border-radius:var(--radius-pill);
    font-size:11.5px;font-weight:700;
    border:1px solid var(--app-border);
    color:var(--text-secondary);
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .step-pill.is-active{background:var(--ink);color:var(--app-bg);border-color:var(--ink)}
  .step-line{width:34px;height:1px;background:var(--app-border)}

  .app-step{display:none}
  .app-step.is-active{display:block;animation:step-in .35s ease both}
  @keyframes step-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  .field{margin-bottom:18px}
  .field:last-of-type{margin-bottom:0}
  .field label{
    display:block;font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:7px;
  }
  .field input, .field textarea{
    width:100%;
    background:var(--input-bg);
    border:1px solid var(--input-border);
    border-radius:var(--radius-input);
    padding:13px 15px;
    font-size:14px;font-family:inherit;color:var(--ink);
    cursor:pointer;
    transition:box-shadow .2s ease, outline-color .2s ease;
  }
  .field input::placeholder, .field textarea::placeholder{color:var(--text-tertiary)}
  .field input.is-typing, .field textarea.is-typing{
    box-shadow:0 0 0 3px var(--accent-soft);
    outline:1.5px solid var(--accent);
  }
  .field-help{margin-top:7px;font-size:11px;color:var(--text-tertiary)}

  .step-footnote{margin-top:18px;text-align:center}
  .step-footnote p{margin-top:9px;font-size:11.5px;color:var(--text-tertiary)}

  .cat-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0 6px}
  .cat-pill{
    padding:9px 15px;
    border-radius:var(--radius-pill);
    border:1px solid var(--app-border);
    background:var(--app-surface);
    color:var(--ink);
    font-size:12.5px;font-weight:600;
    cursor:pointer;
    transition:background .15s ease,color .15s ease,transform .12s ease, border-color .15s ease;
  }
  .cat-pill:hover{border-color:#d8c9ae}
  .cat-pill.is-active{background:var(--ink);color:var(--app-bg);border-color:var(--ink)}
  .cat-pill.is-disabled{
    color:var(--text-tertiary);
    border-style:dashed;
    cursor:not-allowed;
    background:transparent;
  }
  .cat-pill.is-disabled:hover{border-color:var(--app-border)}
  .cat-pill.shake{animation:shake .32s ease}
  @keyframes shake{
    20%{transform:translateX(-4px)}
    50%{transform:translateX(3px)}
    80%{transform:translateX(-2px)}
    100%{transform:translateX(0)}
  }

  .cat-panel{margin-top:22px;animation:step-in .3s ease both}

  .item-card{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
    border:1.5px solid var(--app-border);
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .item-card:hover{border-color:#d8c9ae}
  .item-card.is-selected{border-color:var(--ink);background:var(--tan-highlight)}
  .item-thumb{width:44px;height:44px;border-radius:8px;background:var(--app-border);flex-shrink:0}
  .item-text{flex:1;min-width:0}
  .item-name{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
  .item-meta{display:block;font-size:11.5px;color:var(--text-tertiary);margin-top:2px}
  .item-check{
    width:20px;height:20px;border-radius:50%;flex-shrink:0;
    border:1.5px solid var(--app-border);
    display:flex;align-items:center;justify-content:center;
    color:transparent;
  }
  .item-card.is-selected .item-check{background:var(--ink);border-color:var(--ink);color:var(--app-bg)}

  .photo-row{display:flex;gap:10px;margin-top:8px}
  .photo-box{
    flex:1;
    aspect-ratio:1.2;
    border:1.5px dashed var(--input-border);
    border-radius:10px;
    background:var(--input-bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;
    font-size:10.5px;color:var(--text-tertiary);text-align:center;
    padding:8px;
    transition:border-color .15s ease, background .15s ease;
  }
  .photo-box svg{opacity:.55}
  .photo-box.is-added{border-style:solid;border-color:var(--success);background:var(--success-soft);color:var(--success)}
  .photo-box.is-added svg{opacity:1}

  .success-banner{
    margin-top:16px;
    display:flex;align-items:flex-start;gap:10px;
    padding:14px 16px;
    background:var(--success-soft);
    border:1px solid var(--success);
    border-radius:12px;
    color:var(--success);
    font-size:12.5px;line-height:1.5;
    animation:step-in .3s ease both;
  }
  .success-banner b{display:block;font-size:13px;margin-bottom:2px}

  .lookup-skeleton{margin-top:16px}
  .skel-line{height:11px;border-radius:6px;background:linear-gradient(90deg,var(--app-border) 25%,#f3e9da 37%,var(--app-border) 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite}
  .skel-line + .skel-line{margin-top:10px}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  .lookup-label{margin-top:12px;font-size:11.5px;color:var(--text-tertiary);text-align:center}

  .lookup-result{
    margin-top:16px;
    background:var(--tan-highlight);
    border-radius:12px;
    padding:18px;
    animation:step-in .3s ease both;
  }
  .kv-list{display:flex;flex-direction:column}
  .kv-row{
    display:flex;justify-content:space-between;gap:16px;
    padding:11px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .kv-row:last-child{border-bottom:none;padding-bottom:0}
  .kv-row:first-child{padding-top:0}
  .kv-row dt{color:var(--text-tertiary);flex-shrink:0}
  .kv-row dd{color:var(--ink);text-align:right;font-weight:600}
  .lookup-result .kv-row{border-bottom-color:rgba(43,38,34,.08)}

  .check-row{display:flex;align-items:center;gap:9px;margin:16px 0 18px;font-size:12.5px;color:var(--ink)}
  .check-row input{width:16px;height:16px;accent-color:var(--ink);cursor:pointer}

  /* ---------- slide 2 : AI summary ---------- */
  .loading-row{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:40px 0;
  }
  .loading-row .dot{width:7px;height:7px;border-radius:50%;background:var(--text-tertiary);animation:bounce 1s ease infinite}
  .loading-row .dot:nth-child(2){animation-delay:.15s}
  .loading-row .dot:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
  .loading-label{margin-left:8px;font-size:12px;color:var(--text-tertiary)}

  .summary-content{animation:step-in .4s ease both}
  .badge-row{display:flex;gap:8px;justify-content:center;margin:16px 0 20px}
  .rec-list{list-style:none;display:flex;flex-direction:column;gap:12px}
  .rec-list li{display:flex;gap:12px;font-size:13px;line-height:1.55;color:var(--ink-soft)}
  .rec-num{
    flex-shrink:0;width:20px;height:20px;border-radius:50%;
    background:var(--tan-highlight);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;
  }

  /* ---------- slide 3 : specialist dashboard ---------- */
  .tabs-row{
    display:flex;gap:4px;
    overflow-x:auto;
    padding-bottom:14px;margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex-shrink:0;
    padding:8px 14px;
    border:none;background:transparent;
    font-size:12.5px;font-weight:600;color:var(--text-tertiary);
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.is-active{color:var(--ink);background:var(--tan-highlight)}
  .tab.is-disabled{cursor:not-allowed}
  .tab.is-disabled:hover{color:var(--text-tertiary)}
  .tab.shake{animation:shake .32s ease}

  .card--note{font-size:12.5px;color:var(--text-secondary);padding:16px 20px}

  .action-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .action-row .btn-primary{width:auto;flex:1;min-width:180px}

  .dash-banner{
    margin-top:18px;
    padding:16px 18px;
    background:var(--success-soft);
    border:1px solid var(--success);
    color:var(--success);
    border-radius:12px;
    font-size:13px;font-weight:600;line-height:1.5;
    animation:step-in .3s ease both;
  }

  .composer{
    display:flex;align-items:center;gap:10px;
    margin-top:24px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }
  .reply-input{
    flex:1;
    border:1px solid var(--app-border);
    background:var(--app-surface);
    border-radius:var(--radius-pill);
    padding:12px 18px;
    font-size:13px;font-family:inherit;color:var(--ink);
    cursor:default;
  }
  .reply-input.is-typing{box-shadow:0 0 0 3px var(--accent-soft);outline:1.5px solid var(--accent)}
  .reply-input::placeholder{color:var(--text-tertiary)}
  .send-btn{
    flex-shrink:0;width:38px;height:38px;border-radius:50%;
    border:none;background:var(--app-border);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;cursor:pointer;
    transition:background .15s ease;
  }
  .send-btn.is-ready{background:var(--ink);cursor:pointer}
  .send-btn.is-sent{background:var(--success)}

  /* ---------- responsive ---------- */
  @media (min-width:900px){
    .deck-shell{display:grid;grid-template-columns:44% 56%;height:100vh;overflow:hidden}
    .deck-left{align-items:flex-end;padding:0 60px 0 56px}
    .deck-left-inner{padding:56px 0}
    .deck-right{padding:0 56px 0 16px}
    .deck-hint .kbd{display:inline}
  }
  @media (max-width:640px){
    .deck-buttons{flex-wrap:wrap}
    #appMount{height:min(520px,58vh);padding:24px 18px 32px}
    .browser-chrome{padding:8px 10px}
    .action-row .btn-primary{min-width:100%}
  }
</style>

<div class="stage">
  <div class="deck-shell">
    <div class="deck-left">
      <div class="deck-left-inner" id="deckLeftInner">
        <p class="deck-eyebrow" id="deckEyebrow">Walkthrough · 1 / 3</p>
        <h1 class="deck-title" id="deckTitle">Customer Request</h1>
        <p class="deck-subtitle" id="deckSubtitle"></p>
        <p class="deck-note" id="deckNote"></p>

        <div class="deck-buttons">
          <button class="deck-btn deck-btn--prev" id="prevBtn" aria-label="Previous slide">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Prev
          </button>
          <button class="deck-btn deck-btn--next" id="nextBtn" aria-label="Next slide">
            Next
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
        <p class="deck-hint"><span class="kbd">←  →</span> arrow keys also navigate</p>

        <div class="deck-dots" id="deckDots"></div>
        <p class="deck-caption">Rymax — Customer Support AI POC · Prototype v0.1</p>
      </div>
    </div>

    <div class="deck-right">
      <div class="browser-frame" id="browserFrame">
        <div class="browser-chrome">
          <div class="traffic"><span></span><span></span><span></span></div>
          <div class="browser-nav">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </div>
          <div class="browser-url">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
            <span id="urlBar">rymax.customersupport.com</span>
          </div>
        </div>
        <div class="browser-viewport">
          <div class="app-topbar"><span class="app-topbar__title">Support</span></div>
          <div id="appMount"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var motionOK = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var appMount = document.getElementById('appMount');
  var renderGen = 0;

  /* ---------------- shared helpers ---------------- */
  function typeText(el, text, opts){
    opts = opts || {};
    var speed = opts.speed || 26;
    var isInput = (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
    if(!motionOK){
      if(isInput) el.value = text; else el.textContent = text;
      if(opts.onDone) opts.onDone();
      return;
    }
    var i = 0;
    el.classList.add('is-typing');
    (function step(){
      i++;
      var s = text.slice(0, i);
      if(isInput) el.value = s; else el.textContent = s;
      if(i < text.length){
        setTimeout(step, speed + Math.random()*22);
      } else {
        el.classList.remove('is-typing');
        if(opts.onDone) opts.onDone();
      }
    })();
  }

  function animateCount(el, target, duration){
    if(!duration){ el.textContent = target; return; }
    var start = performance.now();
    function frame(t){
      var p = Math.min(1, (t - start) / duration);
      el.textContent = Math.round(target * p);
      if(p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function shake(el){
    el.classList.remove('shake'); void el.offsetWidth;
    el.classList.add('shake');
  }

  var svgPhoto = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="10" r="1.5"></circle><path d="M21 15l-5-5L5 19"></path></svg>';
  var svgCheck = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 8.5 6.5 12 13 4.5"></polyline></svg>';

  /* ---------------- slide 1 : request form ---------------- */
  function renderSlide1(mount){
    mount.innerHTML =
      '<div class="stepper">' +
        '<span class="step-pill is-active" data-pill="1">1 &middot; Your details</span>' +
        '<span class="step-line"></span>' +
        '<span class="step-pill" data-pill="2">2 &middot; Your request</span>' +
      '</div>' +

      '<div class="app-step is-active" data-step="1">' +
        '<h2 class="app-h2">First, a few details about you</h2>' +
        '<p class="app-sub">We\'ll use this to find your account and route your case faster.</p>' +
        '<div class="card">' +
          '<div class="field"><label for="fName">Full name</label>' +
            '<input id="fName" type="text" readonly placeholder="Click to fill in" data-fill="Marcus Reyes"></div>' +
          '<div class="field"><label for="fEmail">Email or phone</label>' +
            '<input id="fEmail" type="text" readonly placeholder="Click to fill in" data-fill="marcus.reyes@email.com"></div>' +
          '<div class="field"><label for="fOrder">Order number</label>' +
            '<input id="fOrder" type="text" readonly placeholder="Click to fill in" data-fill="#4821">' +
            '<p class="field-help">Optional &mdash; helps us pull up your order instantly</p></div>' +
          '<button class="btn-primary" id="continueBtn" disabled>Continue</button>' +
        '</div>' +
      '</div>' +

      '<div class="app-step" data-step="2">' +
        '<h2 class="app-h2">What can we help with?</h2>' +
        '<p class="app-sub">Pick a category &mdash; the right questions will appear below.</p>' +
        '<div class="cat-row" id="catRow">' +
          '<button class="cat-pill" data-cat="damaged">Damaged item or empty box</button>' +
          '<button class="cat-pill is-disabled" data-cat="wrong" title="Coming soon in this prototype">Wrong item or size</button>' +
          '<button class="cat-pill is-disabled" data-cat="cancel" title="Coming soon in this prototype">Cancel an order</button>' +
          '<button class="cat-pill" data-cat="track">Where is my order</button>' +
          '<button class="cat-pill is-disabled" data-cat="pricing" title="Coming soon in this prototype">Pricing &amp; points</button>' +
          '<button class="cat-pill is-disabled" data-cat="other" title="Coming soon in this prototype">Something else</button>' +
        '</div>' +

        '<div class="cat-panel" id="panelDamaged" hidden>' +
          '<p class="card-label" style="text-align:center">Which item is this about?</p>' +
          '<div class="item-card is-selected" data-item="sweater">' +
            '<span class="item-thumb"></span>' +
            '<span class="item-text"><span class="item-name">Merino Crew Sweater &middot; Navy &middot; M</span><span class="item-meta">#4821 &middot; Delivered Sep 6 &middot; $135.90</span></span>' +
            '<span class="item-check">' + svgCheck + '</span>' +
          '</div>' +
          '<div class="item-card" data-item="bag">' +
            '<span class="item-thumb"></span>' +
            '<span class="item-text"><span class="item-name">Canvas Weekender Bag</span><span class="item-meta">#4835 &middot; Delivered Sep 9 &middot; $210.00</span></span>' +
            '<span class="item-check">' + svgCheck + '</span>' +
          '</div>' +
          '<div class="field" style="margin-top:16px"><label for="issueText">Describe what happened</label>' +
            '<textarea id="issueText" rows="2" readonly placeholder="Click to fill in" data-fill="The box arrived crushed and the sweater inside is torn near the collar."></textarea></div>' +
          '<p class="card-label" style="margin-top:18px">Add photos &mdash; helps us approve faster</p>' +
          '<div class="photo-row">' +
            '<div class="photo-box" data-photo="1">' + svgPhoto + '<span>Box outside</span></div>' +
            '<div class="photo-box" data-photo="2">' + svgPhoto + '<span>Shipping label</span></div>' +
            '<div class="photo-box" data-photo="3">' + svgPhoto + '<span>What was inside</span></div>' +
          '</div>' +
          '<button class="btn-primary" id="submitDamaged" style="margin-top:20px">Submit request</button>' +
        '</div>' +

        '<div class="cat-panel" id="panelTrack" hidden>' +
          '<div class="field"><label for="trackOrder">Order number</label>' +
            '<input id="trackOrder" type="text" readonly></div>' +
          '<div class="lookup-skeleton" id="lookupSkeleton" hidden>' +
            '<div class="skel-line" style="width:60%"></div>' +
            '<div class="skel-line" style="width:80%"></div>' +
            '<div class="skel-line" style="width:45%"></div>' +
            '<p class="lookup-label">Looking up your order&hellip;</p>' +
          '</div>' +
          '<div class="lookup-result" id="lookupResult" hidden>' +
            '<p class="card-label">Found it &mdash; here\'s the latest status</p>' +
            '<div class="kv-list">' +
              '<div class="kv-row"><dt>Status</dt><dd>Shipped &mdash; in transit</dd></div>' +
              '<div class="kv-row"><dt>Carrier</dt><dd>UPS &middot; 1Z999AA10123456784</dd></div>' +
              '<div class="kv-row"><dt>Arriving by</dt><dd>Sep 12, end of day</dd></div>' +
            '</div>' +
          '</div>' +
          '<label class="check-row"><input type="checkbox" id="notifyChk" checked> Notify me by SMS when it\'s delivered</label>' +
          '<button class="btn-primary" id="trackBtn">Track my order</button>' +
        '</div>' +
      '</div>';

    var step1 = mount.querySelector('[data-step="1"]');
    var step2 = mount.querySelector('[data-step="2"]');
    var continueBtn = mount.querySelector('#continueBtn');
    var fName = mount.querySelector('#fName');
    var fEmail = mount.querySelector('#fEmail');

    function checkStep1(){
      continueBtn.disabled = !(fName.value && fEmail.value);
    }
    mount.querySelectorAll('input[data-fill]').forEach(function(input){
      input.addEventListener('click', function(){
        if(input.value) return;
        typeText(input, input.dataset.fill, { onDone: checkStep1 });
      });
    });
    continueBtn.addEventListener('click', function(){
      step1.classList.remove('is-active');
      step2.classList.add('is-active');
      mount.querySelectorAll('.step-pill').forEach(function(p){ p.classList.toggle('is-active', p.dataset.pill === '2'); });
    });

    var panelDamaged = mount.querySelector('#panelDamaged');
    var panelTrack = mount.querySelector('#panelTrack');

    mount.querySelectorAll('.cat-pill').forEach(function(btn){
      btn.addEventListener('click', function(){
        if(btn.classList.contains('is-disabled')){ shake(btn); return; }
        mount.querySelectorAll('.cat-pill').forEach(function(b){ b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        var cat = btn.dataset.cat;
        panelDamaged.hidden = cat !== 'damaged';
        panelTrack.hidden = cat !== 'track';
        if(cat === 'track') initTrack();
      });
    });

    panelDamaged.querySelectorAll('.item-card').forEach(function(card){
      card.addEventListener('click', function(){
        panelDamaged.querySelectorAll('.item-card').forEach(function(c){ c.classList.remove('is-selected'); });
        card.classList.add('is-selected');
      });
    });
    var issueText = panelDamaged.querySelector('#issueText');
    issueText.addEventListener('click', function(){
      if(issueText.value) return;
      typeText(issueText, issueText.dataset.fill, { speed:16 });
    });
    panelDamaged.querySelectorAll('.photo-box').forEach(function(box){
      box.addEventListener('click', function(){ box.classList.toggle('is-added'); });
    });
    panelDamaged.querySelector('#submitDamaged').addEventListener('click', function(e){
      var btn = e.currentTarget;
      if(btn.disabled) return;
      btn.disabled = true;
      btn.textContent = 'Request submitted';
      var banner = document.createElement('div');
      banner.className = 'success-banner';
      banner.innerHTML = '<b>Sent to Rymax AI</b>Your case file is being prepared automatically &mdash; open the next slide to see what the specialist gets.';
      btn.insertAdjacentElement('afterend', banner);
    });

    var trackTimer = null;
    function initTrack(){
      var orderField = panelTrack.querySelector('#trackOrder');
      var skeleton = panelTrack.querySelector('#lookupSkeleton');
      var result = panelTrack.querySelector('#lookupResult');
      orderField.value = '#4821';
      result.hidden = true;
      skeleton.hidden = false;
      clearTimeout(trackTimer);
      trackTimer = setTimeout(function(){
        skeleton.hidden = true;
        result.hidden = false;
      }, motionOK ? 650 : 0);
    }
    panelTrack.querySelector('#trackBtn').addEventListener('click', function(e){
      var btn = e.currentTarget;
      if(btn.disabled) return;
      var notify = panelTrack.querySelector('#notifyChk').checked;
      btn.disabled = true;
      btn.textContent = 'Tracking confirmed';
      var banner = document.createElement('div');
      banner.className = 'success-banner';
      banner.innerHTML = '<b>All set</b>' + (notify ? 'We\'ll text you the moment it\'s delivered.' : 'Tracking saved to your account.');
      btn.insertAdjacentElement('afterend', banner);
    });
  }

  /* ---------------- slide 2 : AI case summary ---------------- */
  function renderSlide2(mount){
    mount.innerHTML =
      '<p class="eyebrow-mini">AI Summary</p>' +
      '<h2 class="app-h2">Preparing the case file</h2>' +
      '<p class="app-sub">Rymax AI reviewed the request and extracted everything a specialist will need.</p>' +
      '<div class="loading-row" id="summaryLoading"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="loading-label">Reading the request&hellip;</span></div>' +
      '<div class="summary-content" id="summaryContent" hidden>' +
        '<div class="badge-row">' +
          '<span class="pill-badge pill-badge--accent">Confidence <b id="confVal">0</b>%</span>' +
          '<span class="pill-badge">Auto-drafted &middot; 2 sec</span>' +
        '</div>' +
        '<div class="card">' +
          '<p class="card-label">What support will see</p>' +
          '<div class="kv-list">' +
            '<div class="kv-row"><dt>Customer</dt><dd>Marcus Reyes</dd></div>' +
            '<div class="kv-row"><dt>Order</dt><dd>#4821 &middot; Merino Sweater, M</dd></div>' +
            '<div class="kv-row"><dt>Category</dt><dd>Damaged item or empty box</dd></div>' +
            '<div class="kv-row"><dt>Priority</dt><dd>Standard</dd></div>' +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<p class="card-label">Issue reported</p>' +
          '<p style="font-size:13px;line-height:1.6;color:var(--ink-soft);font-style:italic">&ldquo;The box arrived crushed and the sweater inside is torn near the collar.&rdquo;</p>' +
        '</div>' +
        '<div class="card">' +
          '<p class="card-label">Recommended solution</p>' +
          '<ol class="rec-list">' +
            '<li><span class="rec-num">1</span>Confirm order #4821 is eligible for replacement &mdash; delivered Sep 6, within the return policy window.</li>' +
            '<li><span class="rec-num">2</span>Offer a free replacement of the Merino Crew Sweater, Navy, size M, at no cost to the customer.</li>' +
            '<li><span class="rec-num">3</span>Send a prepaid return label for the damaged item &mdash; no additional photos required for this case type.</li>' +
          '</ol>' +
        '</div>' +
      '</div>';

    var loading = mount.querySelector('#summaryLoading');
    var content = mount.querySelector('#summaryContent');
    var confVal = mount.querySelector('#confVal');
    var myGen = ++renderGen;
    setTimeout(function(){
      if(myGen !== renderGen) return;
      loading.hidden = true;
      content.hidden = false;
      animateCount(confVal, 92, motionOK ? 700 : 0);
    }, motionOK ? 900 : 0);
  }

  /* ---------------- slide 3 : specialist dashboard ---------------- */
  function renderSlide3(mount){
    mount.innerHTML =
      '<div class="tabs-row" id="tabsRow">' +
        '<button class="tab is-active" data-tab="4821">#4821 &middot; Marcus R.</button>' +
        '<button class="tab is-disabled" title="Not wired up in this prototype">#5560 &middot; Dana K.</button>' +
        '<button class="tab is-disabled" title="Not wired up in this prototype">#5561 &middot; Theo P.</button>' +
        '<button class="tab is-disabled" title="Not wired up in this prototype">#5544 &middot; Priya S.</button>' +
        '<button class="tab is-disabled" title="Not wired up in this prototype">#5539 &middot; Wen L.</button>' +
      '</div>' +
      '<div class="card card--note">Case summary ready &mdash; everything below was compiled automatically before this reached you.</div>' +
      '<div class="card">' +
        '<div class="kv-list">' +
          '<div class="kv-row"><dt>Customer</dt><dd>Marcus Reyes</dd></div>' +
          '<div class="kv-row"><dt>Order</dt><dd>#4821 &middot; Merino Sweater, M &middot; $135.90</dd></div>' +
          '<div class="kv-row"><dt>Category</dt><dd>Damaged item or empty box</dd></div>' +
          '<div class="kv-row"><dt>Issue reported</dt><dd style="text-align:right;max-width:22ch">&ldquo;Box arrived crushed, sweater torn&rdquo;</dd></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<p class="card-label">Recommended solution</p>' +
        '<ol class="rec-list">' +
          '<li><span class="rec-num">1</span>Confirm order #4821 is eligible for replacement &mdash; delivered Sep 6, within policy window.</li>' +
          '<li><span class="rec-num">2</span>Offer a free replacement of the Merino Crew Sweater, Navy, size M.</li>' +
          '<li><span class="rec-num">3</span>Send a prepaid return label &mdash; no additional photos required for this case type.</li>' +
        '</ol>' +
      '</div>' +
      '<div class="action-row" id="actionRow">' +
        '<button class="btn-primary" id="approveBtn">Approve &amp; send replacement</button>' +
        '<button class="btn-outline" id="editBtn">Edit response before sending</button>' +
        '<button class="btn-ghost" id="escalateBtn">Escalate to a phone call</button>' +
      '</div>' +
      '<div class="dash-banner" id="dashBanner" hidden></div>' +
      '<div class="composer">' +
        '<input type="text" class="reply-input" id="replyInput" readonly placeholder="Type your reply to Marcus">' +
        '<button class="send-btn" id="sendBtn" aria-label="Send reply">&uarr;</button>' +
      '</div>';

    mount.querySelectorAll('.tab.is-disabled').forEach(function(tab){
      tab.addEventListener('click', function(){ shake(tab); });
    });

    var actionRow = mount.querySelector('#actionRow');
    var dashBanner = mount.querySelector('#dashBanner');
    function finish(msg){
      actionRow.hidden = true;
      dashBanner.hidden = false;
      dashBanner.textContent = '✓ ' + msg;
    }
    mount.querySelector('#approveBtn').addEventListener('click', function(){
      finish('Approved — the replacement is being packed now. Marcus was notified by email just now.');
    });
    mount.querySelector('#escalateBtn').addEventListener('click', function(){
      finish('Escalated — a specialist will call Marcus within the hour.');
    });

    var replyInput = mount.querySelector('#replyInput');
    var sendBtn = mount.querySelector('#sendBtn');
    mount.querySelector('#editBtn').addEventListener('click', function(){
      if(replyInput.value) return;
      typeText(replyInput, "Hi Marcus — so sorry about the sweater! We're sending a free replacement (Navy, M) plus a prepaid label for the damaged one. It ships today.", { speed:13, onDone: function(){ sendBtn.classList.add('is-ready'); } });
    });
    sendBtn.addEventListener('click', function(){
      if(!replyInput.value) return;
      sendBtn.classList.remove('is-ready');
      sendBtn.classList.add('is-sent');
      replyInput.value = '';
      replyInput.placeholder = 'Sent ✓';
      setTimeout(function(){
        replyInput.placeholder = 'Type your reply to Marcus';
        sendBtn.classList.remove('is-sent');
      }, 1800);
    });
  }

  /* ---------------- deck orchestration ---------------- */
  var SLIDES = [
    {
      id:'request-form',
      eyebrow:'Walkthrough &middot; 1 / 3',
      title:'Customer Request',
      subtitle:"The customer submits one simple form — contact details, order number, and a plain-language description of the issue. No chat, no back-and-forth: the AI gets complete, structured information in a single pass, every time.",
      note:'<span class="live-tag">Live in this demo</span>try <b>Damaged item or empty box</b> and <b>Where is my order</b>. The other categories are shown for context only.',
      url:'rymax.customersupport.com/new-request',
      render: renderSlide1
    },
    {
      id:'case-summary',
      eyebrow:'Walkthrough &middot; 2 / 3',
      title:'AI Case Summary',
      subtitle:'The moment the form is submitted, Rymax AI compiles a case file — customer, order, issue — and drafts a recommended resolution, all in seconds and fully automatic. Nothing for the customer to wait on.',
      note:'',
      url:'rymax.customersupport.com/ai/cases/4821',
      render: renderSlide2
    },
    {
      id:'specialist-dashboard',
      eyebrow:'Walkthrough &middot; 3 / 3',
      title:'Specialist Dashboard',
      subtitle:"The case lands in the specialist's queue alongside their other open tickets, showing the AI summary, recommendation, and full context in one view — with one-click actions to approve, edit, or escalate.",
      note:'',
      url:'rymax-agent.customersupport.com/queue',
      render: renderSlide3
    }
  ];

  var current = 0;
  var eyebrowEl = document.getElementById('deckEyebrow');
  var titleEl = document.getElementById('deckTitle');
  var subtitleEl = document.getElementById('deckSubtitle');
  var noteEl = document.getElementById('deckNote');
  var urlBarEl = document.getElementById('urlBar');
  var leftInner = document.getElementById('deckLeftInner');
  var dotsEl = document.getElementById('deckDots');

  SLIDES.forEach(function(s, i){
    var dot = document.createElement('button');
    dot.className = 'deck-dot' + (i === 0 ? ' is-active' : '');
    dot.setAttribute('aria-label', 'Go to slide ' + (i+1));
    dot.addEventListener('click', function(){ applySlide(i); });
    dotsEl.appendChild(dot);
  });

  function applySlide(index, opts){
    opts = opts || {};
    current = (index + SLIDES.length) % SLIDES.length;
    var s = SLIDES[current];

    eyebrowEl.innerHTML = s.eyebrow;
    titleEl.textContent = s.title;
    subtitleEl.textContent = s.subtitle;
    noteEl.innerHTML = s.note;
    noteEl.hidden = !s.note;
    urlBarEl.textContent = s.url;

    dotsEl.querySelectorAll('.deck-dot').forEach(function(d, i){ d.classList.toggle('is-active', i === current); });

    appMount.innerHTML = '';
    s.render(appMount);
    appMount.scrollTop = 0;

    if(opts.pushHash !== false && location.hash !== '#' + s.id){
      history.replaceState(null, '', '#' + s.id);
    }

    leftInner.classList.remove('deck-left-inner');
    void leftInner.offsetWidth;
    leftInner.style.animation = 'none';
    void leftInner.offsetWidth;
    leftInner.style.animation = '';
  }

  document.getElementById('prevBtn').addEventListener('click', function(){ applySlide(current - 1); });
  document.getElementById('nextBtn').addEventListener('click', function(){ applySlide(current + 1); });
  window.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') applySlide(current + 1);
    if(e.key === 'ArrowLeft') applySlide(current - 1);
  });
  window.addEventListener('hashchange', function(){
    var idx = SLIDES.findIndex(function(s){ return '#' + s.id === location.hash; });
    if(idx >= 0 && idx !== current) applySlide(idx, {pushHash:false});
  });

  var initIdx = SLIDES.findIndex(function(s){ return '#' + s.id === location.hash; });
  applySlide(initIdx >= 0 ? initIdx : 0, {pushHash:false});
})();
</script>
