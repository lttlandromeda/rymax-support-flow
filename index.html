<meta charset="UTF-8">
<title>Rymax Support Walkthrough</title>
<meta name="description" content="A 3-slide interactive walkthrough of the Rymax AI customer-support flow — request form, AI case summary, and specialist dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,420;9..144,520;9..144,600&family=Open+Sans:wght@400;500;600;700&display=swap">

<style>
  :root{
    --stage-bg:#242121;
    --deck-bg:#403c3b;
    --deck-title:#faf4ed;
    --deck-body:#e4dfd8;
    --deck-muted:rgba(228,223,216,.62);
    --deck-faint:rgba(228,223,216,.34);
    --deck-line:rgba(250,244,237,.14);

    --app-bg:#faf4ed;
    --app-surface:#ffffff;
    --app-border:#eae1d7;
    --input-bg:#f7ecdc;
    --input-border:#e8dabf;
    --tan-highlight:#f1e3ce;

    --ink:#2b2621;
    --ink-soft:#4c443c;
    --text-secondary:#6c6259;
    --text-tertiary:#978c7d;
    --line:#e8ddcc;

    --accent:#b25f30;
    --accent-soft:#b25f301c;
    --success:#3e6a49;
    --success-soft:#3e6a4914;

    --radius-card:14px;
    --radius-input:10px;
    --radius-pill:999px;
    --shadow-card:0 1px 2px rgba(43,38,34,.06);
    --shadow-raised:0 24px 60px rgba(0,0,0,.4);

    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--stage-bg)}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  button{font-family:inherit;-webkit-tap-highlight-color:transparent}
  h1,h2,p,dl,dd,dt,ol,ul{margin:0}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }

  /* ---------- stage / deck shell ---------- */
  .stage{
    min-height:100vh;
    background:var(--stage-bg);
    display:flex;
    flex-direction:column;
  }
  .deck-shell{
    flex:1;
    display:flex;
    flex-direction:column;
    background:var(--deck-bg);
  }
  .deck-left{
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:52px 24px 28px;
  }
  .deck-left-inner{
    max-width:560px;
    width:100%;
    opacity:0;
    transform:translateY(10px);
    animation:panel-in .5s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes panel-in{to{opacity:1;transform:translateY(0)}}

  .deck-eyebrow{
    margin:0 0 20px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:1.7px;
    text-transform:uppercase;
    color:var(--deck-faint);
  }
  .deck-title{
    font-family:var(--font-display);
    font-weight:520;
    font-size:clamp(32px,5vw,50px);
    line-height:1.08;
    color:var(--deck-title);
    text-wrap:balance;
  }
  .deck-subtitle{
    margin:18px 0 0;
    font-size:16.5px;
    line-height:1.55;
    color:var(--deck-body);
    max-width:46ch;
  }
  .deck-note{
    margin:18px 0 0;
    font-size:12.5px;
    line-height:1.6;
    color:var(--deck-muted);
    max-width:46ch;
  }
  .deck-note b{color:var(--deck-title);font-weight:600}
  .live-tag{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--accent);
    font-weight:700;
    letter-spacing:.3px;
    margin-right:4px;
  }
  .live-tag::before{
    content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }

  .deck-buttons{display:flex;gap:10px;margin-top:30px}
  .deck-btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:12px 20px;
    border:1px solid var(--deck-line);
    border-radius:var(--radius-pill);
    background:transparent;
    color:var(--deck-body);
    font-size:12.5px;font-weight:600;letter-spacing:.2px;
    cursor:pointer;
    transition:background .16s ease,border-color .16s ease,color .16s ease, transform .16s ease;
  }
  .deck-btn:hover{border-color:rgba(250,244,237,.4);color:var(--deck-title)}
  .deck-btn:active{transform:scale(.97)}
  .deck-btn--next{background:var(--deck-title);color:#2c2825;border-color:var(--deck-title)}
  .deck-btn--next:hover{background:#fff;color:#2c2825}
  .deck-btn svg{display:block}

  .deck-hint{margin:12px 0 0;font-size:11px;color:var(--deck-faint);letter-spacing:.3px}
  .deck-hint .kbd{display:none}

  .deck-dots{display:flex;gap:7px;margin-top:26px}
  .deck-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--deck-line);
    border:none;padding:0;cursor:pointer;
    transition:background .2s ease, width .2s ease;
  }
  .deck-dot.is-active{background:var(--deck-title);width:18px;border-radius:4px}

  .deck-caption{margin:40px 0 0;font-size:10.5px;letter-spacing:.6px;color:rgba(228,223,216,.2)}

  /* ---------- right side / browser mock ---------- */
  .deck-right{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 20px 44px;
  }
  .browser-frame{
    width:min(720px,100%);
    background:linear-gradient(160deg,#4c4645,#312d2c 45%,#1d1a19);
    border-radius:20px;
    padding:10px;
    box-shadow:var(--shadow-raised), inset 0 1px rgba(255,255,255,.08);
    display:flex;
    flex-direction:column;
    opacity:0;
    transform:translateY(14px);
    animation:panel-in .55s cubic-bezier(.22,1,.36,1) .08s forwards;
  }
  .browser-chrome{
    display:flex;align-items:center;gap:14px;
    padding:10px 14px;
    flex:0 0 auto;
  }
  .traffic{display:flex;gap:7px;flex-shrink:0}
  .traffic span{width:11px;height:11px;border-radius:50%;display:block}
  .traffic span:nth-child(1){background:#ec6a5e}
  .traffic span:nth-child(2){background:#f4bf4f}
  .traffic span:nth-child(3){background:#61c454}
  .browser-nav{display:flex;gap:6px;color:rgba(255,255,255,.32);flex-shrink:0}
  .browser-url{
    flex:1;
    display:flex;align-items:center;justify-content:center;gap:6px;
    background:rgba(255,255,255,.08);
    border-radius:7px;
    padding:6px 10px;
    color:rgba(255,255,255,.72);
    font-size:12px;
    min-width:0;
  }
  .browser-url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .browser-viewport{
    background:var(--app-bg);
    border-radius:12px;
    overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
  }
  .app-topbar{
    display:flex;align-items:center;
    padding:16px 28px;
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .app-topbar__title{font-size:15px;font-weight:700;color:var(--ink)}

  .app-scroll{
    position:relative;
    display:flex;
    flex:1;
    min-height:0;
  }
  #appMount{
    --mount-pad-x:28px;
    --mount-pad-top:30px;
    height:min(560px,62vh);
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:var(--mount-pad-top) var(--mount-pad-x) 40px;
    scrollbar-width:none;
  }
  #appMount::-webkit-scrollbar{display:none}
  .scroll-thumb{
    position:absolute;
    top:0;
    right:4px;
    width:4px;
    border-radius:4px;
    background:rgba(43,38,33,.32);
    opacity:0;
    transition:opacity .45s ease;
    pointer-events:none;
  }
  .scroll-thumb.is-visible{opacity:1}

  /* ---------- shared app UI atoms ---------- */
  .app-h2{
    font-family:var(--font-display);
    font-weight:500;
    font-size:26px;
    line-height:1.2;
    color:var(--ink);
    text-align:center;
    text-wrap:balance;
  }
  .app-sub{
    margin:10px auto 0;
    font-size:13.5px;
    color:var(--text-secondary);
    text-align:center;
    max-width:38ch;
  }
  .app-sub--nowrap{max-width:none;margin-bottom:22px}
  .eyebrow-mini{
    text-align:center;
    font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--text-tertiary);
    margin-bottom:8px;
  }
  .card{
    background:var(--app-surface);
    border:1px solid var(--app-border);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-card);
    padding:26px;
  }
  .card + .card{margin-top:16px}
  .card-label{
    font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
    color:var(--text-tertiary);
    margin-bottom:14px;
  }
  .pill-badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:6px 12px;
    border:1px solid var(--app-border);
    border-radius:var(--radius-pill);
    font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
    color:var(--text-secondary);
    background:var(--app-surface);
  }
  .pill-badge--accent{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
  .pill-badge b{font-variant-numeric:tabular-nums}

  .btn-primary{
    width:100%;
    padding:15px 20px;
    background:var(--ink);
    color:var(--app-bg);
    border:none;border-radius:var(--radius-input);
    font-size:14px;font-weight:600;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease, transform .1s ease;
  }
  .btn-primary:hover:not(:disabled){background:#171310}
  .btn-primary:active:not(:disabled){transform:scale(.99)}
  .btn-primary:disabled{opacity:.35;cursor:not-allowed}

  .btn-outline{
    padding:12px 18px;
    background:transparent;
    border:1px solid var(--app-border);
    border-radius:var(--radius-input);
    color:var(--ink);
    font-size:13.5px;font-weight:600;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .btn-outline:hover{background:#2e2e2e0c}

  .btn-ghost{
    padding:12px 18px;
    background:transparent;border:1px solid transparent;
    border-radius:var(--radius-input);
    color:var(--text-secondary);
    font-size:13.5px;font-weight:600;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .btn-ghost:hover{background:#2e2e2e0c;color:var(--ink)}

  /* ---------- slide 1 : request form ---------- */
  .stepper{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px}
  .step-pill{
    padding:8px 14px;border-radius:var(--radius-pill);
    font-size:11.5px;font-weight:700;
    border:1px solid var(--app-border);
    color:var(--text-secondary);
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .step-pill.is-active{background:var(--ink);color:var(--app-bg);border-color:var(--ink)}
  .step-line{width:34px;height:1px;background:var(--app-border)}

  .app-step{display:none}
  .app-step.is-active{display:block;animation:step-in .35s ease both}
  @keyframes step-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  .field{margin-bottom:18px}
  .field:last-of-type{margin-bottom:0}
  .field label{
    display:block;font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:7px;
  }
  .field-label-like{
    display:block;font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:7px;
  }
  .field input, .field textarea{
    width:100%;
    background:#fff;
    border:1px solid var(--input-border);
    border-radius:var(--radius-input);
    padding:13px 15px;
    font-size:14px;font-family:inherit;color:var(--ink);
    cursor:pointer;
    outline:none;
    transition:box-shadow .2s ease, outline-color .2s ease;
  }
  .field input::placeholder, .field textarea::placeholder{color:var(--text-tertiary)}
  .field input.is-typing, .field textarea.is-typing{
    box-shadow:0 0 0 3px rgba(43,38,33,.16);
    outline:1.5px solid var(--ink);
  }
  .field-help{margin-top:7px;font-size:11px;color:var(--text-tertiary)}

  .step-footnote{margin-top:18px;text-align:center}
  .step-footnote p{margin-top:9px;font-size:11.5px;color:var(--text-tertiary)}

  .cat-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0 6px}
  .cat-pill{
    padding:9px 15px;
    border-radius:var(--radius-pill);
    border:1px solid var(--app-border);
    background:var(--app-surface);
    color:var(--ink);
    font-size:12.5px;font-weight:600;
    cursor:pointer;
    transition:background .15s ease,color .15s ease,transform .12s ease, border-color .15s ease;
  }
  .cat-pill:hover{border-color:#d8c9ae}
  .cat-pill.is-active{background:var(--ink);color:var(--app-bg);border-color:var(--ink)}
  .cat-pill.is-disabled{
    color:var(--text-tertiary);
    border-style:dashed;
    cursor:not-allowed;
    background:transparent;
  }
  .cat-pill.is-disabled:hover{border-color:var(--app-border)}
  .cat-pill.shake{animation:shake .32s ease}
  @keyframes shake{
    20%{transform:translateX(-4px)}
    50%{transform:translateX(3px)}
    80%{transform:translateX(-2px)}
    100%{transform:translateX(0)}
  }

  .cat-panel{margin-top:22px;animation:step-in .3s ease both}

  .choice-row{display:flex;gap:8px;margin-top:6px}
  .choice-pill{
    flex:1;
    padding:11px 14px;
    border-radius:var(--radius-input);
    border:1px solid var(--app-border);
    background:var(--app-surface);
    color:var(--ink);
    font-size:13px;font-weight:600;
    text-align:center;
    cursor:pointer;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .choice-pill:hover{border-color:#d8c9ae}
  .choice-pill.is-active{background:var(--ink);color:var(--app-bg);border-color:var(--ink)}

  .item-card{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
    border:1.5px solid var(--app-border);
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .item-card:hover{border-color:#d8c9ae}
  .item-card.is-selected{border-color:var(--ink);background:var(--tan-highlight)}
  .item-thumb{width:44px;height:44px;border-radius:8px;background:var(--app-border);flex-shrink:0}
  .item-text{flex:1;min-width:0}
  .item-name{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
  .item-meta{display:block;font-size:11.5px;color:var(--text-tertiary);margin-top:2px}
  .item-check{
    width:20px;height:20px;border-radius:50%;flex-shrink:0;
    border:1.5px solid var(--app-border);
    display:flex;align-items:center;justify-content:center;
    color:transparent;
  }
  .item-card.is-selected .item-check{background:var(--ink);border-color:var(--ink);color:var(--app-bg)}

  .photo-row{display:flex;align-items:flex-start;gap:10px;margin-top:8px}
  .photo-box{flex:1;cursor:pointer}
  .photo-box-empty{
    aspect-ratio:1.2;
    border:1.5px dashed var(--input-border);
    border-radius:10px;
    background:var(--input-bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    font-size:10.5px;color:var(--text-tertiary);text-align:center;
    padding:8px;
    transition:border-color .15s ease, background .15s ease;
  }
  .photo-box-empty svg{opacity:.55}
  .photo-box-added{
    display:none;
    aspect-ratio:1.2;
    flex-direction:column;
    padding:10px;
    background:#fff;
    border:1px solid var(--input-border);
    border-radius:10px;
  }
  .photo-thumb{flex:1;width:100%;border-radius:8px;background:#e5e5e5}
  .photo-added-label{
    margin-top:8px;
    font-size:11px;font-weight:400;color:#8a8a8a;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .photo-box.is-added .photo-box-empty{display:none}
  .photo-box.is-added .photo-box-added{display:flex}

  .success-banner{
    margin-top:16px;
    display:flex;align-items:flex-start;gap:10px;
    padding:14px 16px;
    background:var(--success-soft);
    border:1px solid var(--success);
    border-radius:12px;
    color:var(--success);
    font-size:12.5px;line-height:1.5;
    animation:step-in .3s ease both;
  }
  .success-banner b{display:block;font-size:13px;margin-bottom:2px}

  .lookup-skeleton{margin-top:16px}
  .skel-line{height:11px;border-radius:6px;background:linear-gradient(90deg,var(--app-border) 25%,#f3e9da 37%,var(--app-border) 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite}
  .skel-line + .skel-line{margin-top:10px}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  .lookup-label{margin-top:12px;font-size:11.5px;color:var(--text-tertiary);text-align:center}

  .lookup-result{
    margin-top:16px;
    background:#fff;
    border:1px solid var(--input-border);
    border-radius:12px;
    padding:18px;
    animation:step-in .3s ease both;
  }
  .kv-list{display:flex;flex-direction:column}
  .kv-row{
    display:flex;justify-content:space-between;gap:16px;
    padding:11px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .kv-row:last-child{border-bottom:none;padding-bottom:0}
  .kv-row:first-child{padding-top:0}
  .kv-row dt{color:var(--text-tertiary);flex-shrink:0}
  .kv-row dd{color:var(--ink);text-align:right;font-weight:600}
  .lookup-result .kv-row{border-bottom-color:rgba(43,38,34,.08)}

  .check-row{display:flex;align-items:center;gap:9px;margin:16px 0 18px;font-size:12.5px;color:var(--ink)}
  .check-row input{width:16px;height:16px;accent-color:var(--ink);cursor:pointer}

  /* ---------- slide 2 : AI summary ---------- */
  .loading-row{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:40px 0;
  }
  .loading-row[hidden]{display:none}
  .loading-row .dot{width:7px;height:7px;border-radius:50%;background:var(--text-tertiary);animation:bounce 1s ease infinite}
  .loading-row .dot:nth-child(2){animation-delay:.15s}
  .loading-row .dot:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
  .loading-label{margin-left:8px;font-size:12px;color:var(--text-tertiary)}

  .summary-content > *{opacity:0;animation:step-in .4s ease both}
  .summary-content > *:nth-child(1){animation-delay:.05s}
  .summary-content > *:nth-child(2){animation-delay:.16s}
  .summary-content > *:nth-child(3){animation-delay:.27s}
  .summary-content > *:nth-child(4){animation-delay:.38s}
  .badge-row{display:flex;gap:8px;justify-content:center;margin:16px 0 20px}
  .rec-list{list-style:none;display:flex;flex-direction:column;gap:12px}
  .rec-list li{display:flex;gap:12px;font-size:13px;line-height:1.55;color:var(--ink-soft)}
  .rec-num{
    flex-shrink:0;width:20px;height:20px;border-radius:50%;
    background:var(--tan-highlight);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;
  }

  /* ---------- slide 3 : specialist dashboard ---------- */
  .tabs-row{
    display:flex;gap:4px;
    flex-wrap:wrap;
    overflow:visible;
    background:var(--app-surface);
    margin:calc(-1 * var(--mount-pad-top)) calc(-1 * var(--mount-pad-x)) 20px;
    padding:14px var(--mount-pad-x) 0;
    border-bottom:1px solid var(--app-border);
    position:sticky;
    top:calc(-1 * var(--mount-pad-top));
    z-index:2;
  }
  .tab{
    flex-shrink:0;
    padding:10px 14px 12px;
    border:none;border-bottom:2px solid transparent;
    margin-bottom:-1px;
    background:transparent;
    font-size:12.5px;font-weight:600;color:var(--text-tertiary);
    cursor:pointer;
    white-space:nowrap;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab.is-active{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

  .dash-note{
    font-size:12.5px;
    color:var(--text-secondary);
    line-height:1.5;
    padding-bottom:18px;
    margin-bottom:4px;
    border-bottom:1px solid var(--line);
  }
  .kv-list--info .kv-row{gap:20px;align-items:flex-start}

    var trackHeight = appMount.clientHeight;
    var contentHeight = appMount.scrollHeight;
    if(contentHeight <= trackHeight + 1){
      scrollThumbDisabled = true;
      scrollThumb.classList.remove('is-visible');
      return;
    }
    scrollThumbDisabled = false;
    var thumbHeight = Math.max(MIN_THUMB, trackHeight * (trackHeight / contentHeight));
    var maxTravel = trackHeight - thumbHeight;
    var scrollRange = contentHeight - trackHeight;
    var progress = scrollRange > 0 ? appMount.scrollTop / scrollRange : 0;
    scrollThumb.style.height = thumbHeight + 'px';
    scrollThumb.style.transform = 'translateY(' + (maxTravel * progress) + 'px)';
  }

  function showThumb(){
    updateThumb();
    if(scrollThumbDisabled) return;
    scrollThumb.classList.add('is-visible');
    clearTimeout(scrollHideTimer);
    scrollHideTimer = setTimeout(function(){
      scrollThumb.classList.remove('is-visible');

      if(isInput) el.value = text; else el.textContent = text;
      if(opts.onDone) opts.onDone();
      return;
    }
    var i = 0;
    el.classList.add('is-typing');
    (function step(){
      i++;
      var s = text.slice(0, i);
      if(isInput) el.value = s; else el.textContent = s;
      if(i < text.length){
        setTimeout(step, speed + Math.random()*22);
      } else {
        el.classList.remove('is-typing');
        if(opts.onDone) opts.onDone();
      }
    })();
  }

    if(!duration){ el.textContent = target; return; }
    var start = performance.now();
    function frame(t){
      var p = Math.min(1, (t - start) / duration);
      el.textContent = Math.round(target * p);
      if(p < 1) requestAnimationFrame(frame);
    }

          '<button type="button" class="cat-pill" data-action="decline">Decline the request</button>' +
          '<button type="button" class="cat-pill" data-action="escalate">Escalate to a phone call</button>' +
        '</div>' +
        '<div class="composer" id="composer" hidden>' +
          '<div class="field"><label for="replyInput">Reply to ' + c.replyToName + '</label>' +

          '<button class="btn-primary" id="sendBtn">Send reply</button>' +
        '</div>' +
        '<div class="dash-banner" id="dashBanner" hidden></div>';

          var id = tab.dataset.tab;
          if(id === activeId) return;
          activeId = id;
          draw();
        });

      var composer = mount.querySelector('#composer');
      var replyInput = mount.querySelector('#replyInput');
      var sendBtn = mount.querySelector('#sendBtn');
      var dashBanner = mount.querySelector('#dashBanner');
      var selectedAction = null;

  function applySlide(index, opts){
    opts = opts || {};
    current = (index + SLIDES.length) % SLIDES.length;
    var s = SLIDES[current];

    eyebrowEl.innerHTML = s.eyebrow;
    titleEl.textContent = s.title;
    subtitleEl.textContent = s.subtitle;
    noteEl.innerHTML = s.note;
    noteEl.hidden = !s.note;
    urlBarEl.textContent = s.url;

    dotsEl.querySelectorAll('.deck-dot').forEach(function(d, i){ d.classList.toggle('is-active', i === current); });

    appMount.innerHTML = '';
    s.render(appMount);
    appMount.scrollTop = 0;
    scrollThumb.classList.remove('is-visible');
    updateThumb();
    setTimeout(updateThumb, 1000);

    if(opts.pushHash !== false && location.hash !== '#' + s.id){
      history.replaceState(null, '', '#' + s.id);
    }

    leftInner.classList.remove('deck-left-inner');
    void leftInner.offsetWidth;
    leftInner.style.animation = 'none';
    void leftInner.offsetWidth;
    leftInner.style.animation = '';
  }

  document.getElementById('prevBtn').addEventListener('click', function(){ applySlide(current - 1); });
  document.getElementById('nextBtn').addEventListener('click', function(){ applySlide(current + 1); });
  window.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') applySlide(current + 1);
    if(e.key === 'ArrowLeft') applySlide(current - 1);
  });
  window.addEventListener('hashchange', function(){
    var idx = SLIDES.findIndex(function(s){ return '#' + s.id === location.hash; });
    if(idx >= 0 && idx !== current) applySlide(idx, {pushHash:false});
  });

  var initIdx = SLIDES.findIndex(function(s){ return '#' + s.id === location.hash; });
  applySlide(initIdx >= 0 ? initIdx : 0, {pushHash:false});
})();
